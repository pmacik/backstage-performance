kind: Backstage
apiVersion: rhdh.redhat.com/v1alpha3
metadata:
  name: developer-hub
  namespace: pmacik
spec:
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh
          key: app-config.rhdh.yaml
        - name: app-config-backend-secret
          key: app-config.rhdh.backend-secret.yaml
      mountPath: /opt/app-root/src
    dynamicPluginsConfigMapName: "dynamic-plugins-rhdh"
    extraFiles:
      configMaps:
        - name: rbac-policy
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: LOG_LEVEL
          value: "${RHDH_LOG_LEVEL}"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: NODE_ENV
          value: development
      secrets:
        - key: BACKEND_SECRET
          name: rhdh-backend-secret
    replicas: 1
    route:
      enabled: true
  database:
    enableLocalDb: true
  deployment:
    patch:
      spec:
        template:
          spec:
            volumes:
              - name: dynamic-plugins-root
                ephemeral:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      resources:
                        requests:
                          storage: 1Gi
                      volumeMode: Filesystem
